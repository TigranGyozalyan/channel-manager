jdbc.driverClassName=org.postgresql.Driver
#                      *** prepareThreshold=-1 ***
# Activates server-prepared statements right away and forces Binary transfer
#
# Binary transfer is possible only with server-prepared statements, because it's the client who needs to tell
# which of the columns should be transferred in Binary vs Text. Server-prepared statements allow this because
# the list of columns is returned in the response to PARSE PG message, that's used in the Extended Query Protocol.
#
# Binary transfer is important because Text transfer (default) forces PG to send the binary (including huge blobs)
# in hex. So 2 hex letters for each 1 byte - this increases the traffic between the DB. Additionally, PG has an
# internal limit of 1GB per transferred column. So a 600MB blob transferred in hex will exceed this limit,
# causing the query to fail.
#
#                      *** preferQueryMode=extendedForPrepared ***
# Deactivates server-prepared statements for the usual Statement. For some reason the authors of pgJDBC decided it's
# a good idea to use the same mechanism for Statements when `prepareThreshold=-1` is specified. This uncovered a
# problem (feature?) in PG: the statements are sent for PARSE & DESCRIBE for each sub-statement first, and only
# then BIND & EXECUTE are supposed to be sent. But for PARSE message PG must respond with the list of the columns.
# Yet those columns don't exist because the DDL hasn't been executed. We get an error. Which breaks our DB Migrations.
#
#                     *** preparedStatementCacheQueries ***
# At the moment (2026) we already crossed the default 256 statements in the cache. To check the current number of
# statements, debug `org.postgresql.util.LruCache#removeEldestEntry()`. It shouldn't be a big deal if we cross the
# limit though - maybe some of the queries are used very rarely.
db.options=prepareThreshold=-1&preferQueryMode=extendedForPrepared&preparedStatementCacheQueries=512
db.url=jdbc:postgresql://localhost:5432/local_elsci?currentSchema=boardeaux
db.url_final=${db.url}&${db.options}
db.user=local_boardeaux
db.pass=password

security.in_memory_users.name=admin,user
security.in_memory_users.password=admin,user

self_url=http://localhost:8080

security.oauth2.enabled=false
hub_mode=false

# redis configuration. Will be ignored if 'sessions-redis' profile is not active (corresponding env property is: 'SPRING_PROFILES_ACTIVE')
# Needs to be set on env level, setting the property here won't work
redis.username=boardeaux
redis.password=boardeauxpass

# redis host. Protocol and port must be omitted. http://localhost:6379 won't work.
redis.host=localhost
redis.port=6379

# sets the connection name in redis. If we use the same redis for multiple services later, it will be easier to trace
# which connections belongs to which service. Must not contain spaces
redis.client=boardeaux

# shutdown timeout
redis.shutdown.timeoutSeconds=5

# shutdown quiet period
redis.shutdown.quietPeriodSeconds=5

# A good general rule of thumb is to follow the rule
# TCP_USER_TIMEOUT = TCP_KEEP_IDLE + TCP_KEEPINTVL * TCP_KEEPCNT
redis.connection.tcp.userTimeout=45

# The time the connection needs to remain idle before TCP starts sending keepalive probes
redis.connection.keepalive.idleSeconds=15

# The time between individual keepalive probes
redis.connection.keepalive.intervalSeconds=10

# how many attempts are made to send probes before dropping the connection
redis.connection.keepalive.probeCount=3

# keepalive probe timeout
redis.connection.keepalive.timeoutSeconds=10

# namespace that spring uses to store sessions in redis
security.redis.namespace=${redis.username}

# TTL is set to 'server.servlet.session.timeout_min'. Default is 30 days
security.redis.session.timeout_mins=#{${server.servlet.session.timeout_min:null} ?: 30 * 24 * 60L}

trello.host=https://api.trello.com
trello.api_key=insertYourApiKey
trello.api_token=insertYourToken